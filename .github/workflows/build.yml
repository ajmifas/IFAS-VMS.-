name: IFAS VMS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract IFAS VMS ZIP
            - name: Extract IFAS VMS ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem `
            -Path . `
            -Filter "*.zip" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch "\\.git\\"
            } |
            Select-Object -First 1

          if (-not $zip) {
            Write-Error "No ZIP file found in repository."
            exit 1
          }

          Write-Host "ZIP found:"
          Write-Host $zip.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path source | Out-Null

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath source `
            -Force

          Write-Host "ZIP extracted successfully."

          if (-not $zip) {
            Write-Error "IFAS-VMS-SERVER.zip not found."
            exit 1
          }

          Write-Host "ZIP found:"
          Write-Host $zip.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path source | Out-Null

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath source `
            -Force

          Write-Host "ZIP extracted successfully."

      - name: Find Visual Studio Solution
        shell: pwsh
        run: |
          $sln = Get-ChildItem `
            -Path source `
            -Filter "*.sln" `
            -Recurse |
            Select-Object -First 1

          if (-not $sln) {
            Write-Error "No Visual Studio solution (.sln) found inside the ZIP."
            exit 1
          }

          Write-Host "Solution found:"
          Write-Host $sln.FullName

          "SOLUTION=$($sln.FullName)" >> $env:GITHUB_ENV

      - name: Restore NuGet Packages
        run: |
          dotnet restore "$env:SOLUTION"

      - name: Build Solution
        run: |
          dotnet build "$env:SOLUTION" `
            -c Release `
            --no-restore

      - name: Publish Projects
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path publish | Out-Null

          $projects = Get-ChildItem `
            -Path source `
