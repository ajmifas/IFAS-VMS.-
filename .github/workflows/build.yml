name: IFAS VMS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find and Extract IFAS VMS ZIP
        shell: pwsh
        run: |
          $zips = Get-ChildItem `
            -Path . `
            -Filter "*.zip" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch "\\.git\\"
            }

          if (-not $zips) {
            Write-Error "No ZIP file found in repository."
            exit 1
          }

          Write-Host "ZIP files found:"
          $zips | ForEach-Object {
            Write-Host $_.FullName
          }

          $zip = $zips | Select-Object -First 1

          Write-Host ""
          Write-Host "Using ZIP:"
          Write-Host $zip.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path source | Out-Null

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath source `
            -Force

          Write-Host "Extraction completed."

      - name: Show Project Structure
        shell: pwsh
        run: |
          Write-Host "Searching for solution and project files..."

          Get-ChildItem `
            -Path source `
            -Include "*.sln","*.csproj" `
            -File `
            -Recurse |
            ForEach-Object {
              Write-Host $_.FullName
            }

      # ---------------------------------------------------------
      # FIX 1 - VMS CLIENT WPF PROJECT
      # ---------------------------------------------------------

      - name: Fix VMS Client WPF Project
        shell: pwsh
        run: |
          $project = Get-ChildItem `
            -Path source `
            -Filter "IFAS.VMS.Client.csproj" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            Write-Host "VMS Client project not found."
            exit 0
          }

          Write-Host "Fixing:"
          Write-Host $project.FullName

          $path = $project.FullName
          $content = Get-Content $path -Raw

          $content = $content.Replace(
            'Microsoft.NET.Sdk.WindowsDesktop',
            'Microsoft.NET.Sdk'
          )

          if ($content -notmatch '<UseWPF>true</UseWPF>') {
            $content = $content.Replace(
              '</PropertyGroup>',
              "    <UseWPF>true</UseWPF>`r`n  </PropertyGroup>",
              1
            )
          }

          Set-Content `
            -Path $path `
            -Value $content `
            -Encoding UTF8

          Write-Host "VMS Client WPF project fixed."

      # ---------------------------------------------------------
      # FIX 2 - VMS CLIENT APP.XAML.CS
      # ---------------------------------------------------------

      - name: Fix VMS Client Application Reference
        shell: pwsh
        run: |
          $file = Get-ChildItem `
            -Path source `
            -Filter "App.xaml.cs" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -match "03-IFAS-VMS-CLIENT"
            } |
            Select-Object -First 1

          if (-not $file) {
            Write-Host "Client App.xaml.cs not found."
            exit 0
          }

          Write-Host "Fixing:"
          Write-Host $file.FullName

          $path = $file.FullName
          $content = Get-Content $path -Raw

          $content = $content.Replace(
            ': Application',
            ': System.Windows.Application'
          )

          Set-Content `
            -Path $path `
            -Value $content `
            -Encoding UTF8

          Write-Host "Client Application reference fixed."

      # ---------------------------------------------------------
      # FIX 3 - LICENSE MANAGER ROOT PROJECT
      # ---------------------------------------------------------

      - name: Fix License Manager Root Project
        shell: pwsh
        run: |
          $project = Get-ChildItem `
            -Path source `
            -Filter "IFAS.LicenseManager.csproj" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            Write-Host "License Manager project not found."
            exit 0
          }

          Write-Host "Fixing:"
          Write-Host $project.FullName

          $path = $project.FullName
          $content = Get-Content $path -Raw

          if ($content -notmatch 'Compile Remove="IFAS.LicenseCreator.Desktop') {

            $removeBlock = @'

  <ItemGroup>
    <Compile Remove="IFAS.LicenseCreator.Desktop\**" />
    <EmbeddedResource Remove="IFAS.LicenseCreator.Desktop\**" />
    <None Remove="IFAS.LicenseCreator.Desktop\**" />
    <Content Remove="IFAS.LicenseCreator.Desktop\**" />
  </ItemGroup>
'@

            $content = $content.Replace(
              '</Project>',
              $removeBlock + "`r`n</Project>"
            )
          }

          Set-Content `
            -Path $path `
            -Value $content `
            -Encoding UTF8

          Write-Host "License Manager root project fixed."

      # ---------------------------------------------------------
      # FIX 4 - LICENSE CREATOR DESKTOP WPF
      # ---------------------------------------------------------

      - name: Fix License Creator Desktop WPF
        shell: pwsh
        run: |
          $project = Get-ChildItem `
            -Path source `
            -Filter "IFAS.LicenseCreator.Desktop.csproj" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            Write-Host "License Creator Desktop project not found."
            exit 0
          }

          Write-Host "Fixing:"
          Write-Host $project.FullName

          $path = $project.FullName
          $content = Get-Content $path -Raw

          $content = $content.Replace(
            'Microsoft.NET.Sdk.WindowsDesktop',
            'Microsoft.NET.Sdk'
          )

          if ($content -notmatch '<UseWPF>true</UseWPF>') {
            $content = $content.Replace(
              '</PropertyGroup>',
              "    <UseWPF>true</UseWPF>`r`n  </PropertyGroup>",
              1
            )
          }

          Set-Content `
            -Path $path `
            -Value $content `
            -Encoding UTF8

          Write-Host "License Creator Desktop WPF project fixed."

      # ---------------------------------------------------------
      # FIX 5 - LICENSE CREATOR DESKTOP SOURCE
      # ---------------------------------------------------------

      - name: Fix License Creator Desktop Source
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            -Path source `
            -Filter "*.cs" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -match "IFAS.LicenseCreator.Desktop"
            }

          foreach ($file in $files) {

            Write-Host "Checking:"
            Write-Host $file.FullName

            $path = $file.FullName
            $content = Get-Content $path -Raw

            if (
              $content -match '\bApplication\b' -or
              $content -match '\bWindow\b' -or
              $content -match '\bRoutedEventArgs\b'
            ) {

              if ($content -notmatch 'using System\.Windows;') {

                $content =
                  "using System.Windows;`r`n" +
                  $content
              }
            }

            $content = $content.Replace(
              ': Application',
              ': System.Windows.Application'
            )

            Set-Content `
              -Path $path `
              -Value $content `
              -Encoding UTF8
          }

          Write-Host "License Creator Desktop source fixed."

      # ---------------------------------------------------------
      # FIX 6 - SERVER LICENSE SERVICE
      # ---------------------------------------------------------

      - name: Fix Server LicenseService
        shell: pwsh
        run: |
          $file = Get-ChildItem `
            -Path source `
            -Filter "LicenseService.cs" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -match "01-IFAS-VMS-SERVER"
            } |
            Select-Object -First 1

          if (-not $file) {
            Write-Host "Server LicenseService.cs not found."
            exit 0
          }

          Write-Host "Fixing:"
          Write-Host $file.FullName

          $path = $file.FullName
          $content = Get-Content $path -Raw

          if ($content -notmatch 'using Microsoft\.EntityFrameworkCore;') {

            $content =
              "using Microsoft.EntityFrameworkCore;`r`n" +
              $content
          }

          Set-Content `
            -Path $path `
            -Value $content `
            -Encoding UTF8

          Write-Host "Server EF Core namespace fixed."

      # ---------------------------------------------------------
      # FIND SOLUTION
      # ---------------------------------------------------------

      - name: Find Solution
        shell: pwsh
        run: |
          $sln = Get-ChildItem `
            -Path source `
            -Filter "*.sln" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $sln) {
            Write-Error "No .sln file found."
            exit 1
          }

          Write-Host "Solution:"
          Write-Host $sln.FullName

          "SOLUTION=$($sln.FullName)" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # RESTORE
      # ---------------------------------------------------------

      - name: Restore
        run: |
          dotnet restore "$env:SOLUTION"

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------

      - name: Build
        run: |
          dotnet build "$env:SOLUTION" `
            -c Release `
            --no-restore

      # ---------------------------------------------------------
      # PUBLISH
      # ---------------------------------------------------------

      - name: Publish
        shell: pwsh
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path publish | Out-Null

          $projects = Get-ChildItem `
            -Path source `
            -Filter "*.csproj" `
            -File `
            -Recurse

          foreach ($project in $projects) {

            Write-Host ""
            Write-Host "Publishing:"
            Write-Host $project.FullName

            $name = $project.BaseName

            dotnet publish `
              $project.FullName `
              -c Release `
              -r win-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -o "publish/$name"
          }

      # ---------------------------------------------------------
      # CREATE WINDOWS ZIP
      # ---------------------------------------------------------

      - name: Create Windows ZIP
        shell: pwsh
        run: |

          if (-not (Test-Path "publish")) {
            Write-Error "Publish folder not found."
            exit 1
          }

          Compress-Archive `
            -Path "publish/*" `
            -DestinationPath "IFAS-VMS-WIN-X64.zip" `
            -Force

          Write-Host ""
          Write-Host "======================================"
          Write-Host "IFAS VMS WINDOWS BUILD CREATED"
          Write-Host "======================================"

      # ---------------------------------------------------------
      # UPLOAD ARTIFACT
      # ---------------------------------------------------------

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: IFAS-VMS-WIN-X64
          path: IFAS-VMS-WIN-X64.zip
